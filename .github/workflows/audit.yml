name: MSPA Behavioral Audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance-and-benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure acceptance suite
        run: cmake -S . -B build -DMSPA_BUILD_TESTS=ON -DMSPA_BUILD_BENCHMARKS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build acceptance suite
        run: cmake --build build --parallel 2
      - name: Verbose CTest evidence
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir build -C Release --output-on-failure -V | tee audit-ctest.log
      - name: Performance baseline
        shell: bash
        run: |
          set -o pipefail
          ./build/mspa_benchmark | tee audit-benchmark.log
      - uses: actions/upload-artifact@v4
        with:
          name: mspa-audit-evidence
          path: |
            audit-ctest.log
            audit-benchmark.log

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v4
      - name: Configure fuzzer
        run: cmake -S . -B build-fuzz -DMSPA_BUILD_TESTS=OFF -DMSPA_BUILD_FUZZ=ON -DCMAKE_BUILD_TYPE=Debug
      - name: Build fuzzer
        run: cmake --build build-fuzz --parallel 2
      - name: Run hostile-input smoke corpus
        shell: bash
        run: |
          set -o pipefail
          ./build-fuzz/mspa_deserialize_fuzz -runs=5000 2>&1 | tee audit-fuzz.log
      - uses: actions/upload-artifact@v4
        with:
          name: mspa-fuzz-evidence
          path: audit-fuzz.log

  mutation-coverage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mutation: [hysteresis, baseline, rebase, quotas, canonical_order, reappraisal]
    steps:
      - uses: actions/checkout@v4
      - name: Configure mutation build
        run: cmake -S . -B build-mutant -DMSPA_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
      - name: Build phase 2 public API tests
        run: cmake --build build-mutant --parallel 2
      - name: Confirm originals pass
        shell: bash
        run: |
          ./build-mutant/mspa_audit_phase2_behavior_tests
          ./build-mutant/mspa_audit_phase2_system_tests
      - name: Apply deliberate regression
        shell: bash
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          mutation = os.environ["MUTATION"]

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"mutation pattern not found: {mutation}: {path}")
              p.write_text(text.replace(old, new))

          if mutation == "hysteresis":
              Path("src/decision/hysteresis.cpp").write_text('''#include "mspa/decision/hysteresis.hpp"\nnamespace mspa {\nfloat HysteresisPolicy::continuity_bonus(const AgentPsychState&,const ActionOption&,ActionContinuityKey,float)const noexcept{return 0.0f;}\nfloat HysteresisPolicy::switch_threshold(const AgentPsychState&,const ActionOption&,float)const noexcept{return 0.0f;}\n}\n''')
          elif mutation == "baseline":
              replace("src/psychology/emotions.cpp",
                      "float clamp_baseline(float value){return std::clamp(value,active_emotion_floor,0.15f);}",
                      "float clamp_baseline(float){return 0.0f;}")
          elif mutation == "rebase":
              replace("src/persistence/state_transfer.cpp",
                      "e.origin_time_domain.scale,dest.scale",
                      "e.origin_time_domain.scale,e.origin_time_domain.scale")
          elif mutation == "quotas":
              replace("src/validation/limits.cpp",
                      "s.memories.size()>l.max_memories_per_agent||",
                      "false||")
          elif mutation == "canonical_order":
              replace("src/runtime/runtime.cpp", "return aa<bb", "return bb<aa")
          elif mutation == "reappraisal":
              replace("src/psychology/reappraisal.cpp",
                      "it->certainty=std::clamp(c,0.0f,1.0f);return {};",
                      "it->certainty=std::clamp(c,0.0f,1.0f);it->proposition.positive=!it->proposition.positive;return {};")
          else:
              raise SystemExit(f"unknown mutation: {mutation}")
          PY
      - name: Mutation must be killed by public API tests
        shell: bash
        env:
          MUTATION: ${{ matrix.mutation }}
        run: |
          set -o pipefail
          cmake --build build-mutant --parallel 2
          case "$MUTATION" in
            rebase|quotas|canonical_order) TEST=./build-mutant/mspa_audit_phase2_system_tests ;;
            *) TEST=./build-mutant/mspa_audit_phase2_behavior_tests ;;
          esac
          LOG="audit-mutation-${MUTATION}.log"
          if "$TEST" > "$LOG" 2>&1; then
            cat "$LOG"
            echo "FAIL: mutation survived: $MUTATION"
            exit 1
          else
            cat "$LOG"
            echo "MUTATION_KILLED: $MUTATION"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mspa-mutation-${{ matrix.mutation }}
          path: audit-mutation-${{ matrix.mutation }}.log
